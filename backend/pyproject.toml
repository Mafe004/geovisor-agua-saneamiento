[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is a formatter concern, not a linter one
    "B008", # FastAPI's DI idiom is `= Depends(...)` in the signature; that's intentional, not a bug
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits a real MySQL database (geovisor_test) through TestClient, not a pure-Python unit test",
]
